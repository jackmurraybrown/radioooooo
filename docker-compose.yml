services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: radiooo
      POSTGRES_USER: radiooo
      POSTGRES_PASSWORD: radiooo
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U radiooo -d radiooo"]
      interval: 5s
      timeout: 5s
      retries: 5

  api:
    build: ./api
    ports:
      - "8080:8080"
    env_file: ./api/.env
    volumes:
      - ./streaming/socket:/var/run/liquidsoap:ro
    depends_on:
      db:
        condition: service_healthy

  icecast:
    build:
      context: ./streaming
      dockerfile: Dockerfile.icecast
    ports:
      - "8000:8000"
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "cat /proc/net/tcp6 | grep -q 1F40 || cat /proc/net/tcp | grep -q 1F40",
        ]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

  liquidsoap:
    image: savonet/liquidsoap:v2.4.4
    volumes:
      - ./streaming/radio.liq:/radio.liq:ro
      - ./streaming/test-media:/media:ro
      - ./streaming/fallback-media:/media/fallback:ro
      - ./streaming/socket:/var/run/liquidsoap
    command: ["/radio.liq"]
    ports:
      - "8005:8005"
    depends_on:
      icecast:
        condition: service_healthy
    restart: unless-stopped

  mailpit:
    image: axllent/mailpit
    ports:
      - "8025:8025"
      - "1025:1025"
    restart: unless-stopped

volumes:
  postgres_data:
