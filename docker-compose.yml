services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: radiooo
      POSTGRES_USER: radiooo
      POSTGRES_PASSWORD: radiooo
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U radiooo -d radiooo"]
      interval: 5s
      timeout: 5s
      retries: 5

  api:
    build: ./api
    ports:
      - "8080:8080"
    env_file: ./api/.env
    depends_on:
      db:
        condition: service_healthy

  # ✮⋆‧°—°‧⋆✮ streaming stack — icecast + liquidsoap (v0.3)
  icecast:
    build:
      context: ./streaming
      dockerfile: Dockerfile.icecast
    ports:
      - "8000:8000"
    healthcheck:
      test: ["CMD-SHELL", "cat /proc/net/tcp6 | grep -q 1F40 || cat /proc/net/tcp | grep -q 1F40"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

  liquidsoap:
    image: savonet/liquidsoap:v2.4.4
    volumes:
      - ./streaming/radio.liq:/radio.liq:ro
      - ./streaming/test-media:/media:ro
    command: ["/radio.liq"]
    ports:
      - "1234:1234"   # telnet control — Go broadcast controller connects here
    depends_on:
      icecast:
        condition: service_healthy
    restart: unless-stopped

volumes:
  postgres_data:
